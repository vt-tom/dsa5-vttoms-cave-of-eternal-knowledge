name: Release Module

on:
  push:
    tags:
      - '*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches module.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          MODULE_VERSION=$(jq -r '.version' module.json)
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) stimmt nicht mit der version in module.json ($MODULE_VERSION) ueberein."
            exit 1
          fi

      - name: Create module zip
        run: zip -r dsa5-vttoms-cave-of-eternal-knowledge.zip . -x ".git/*" ".github/*"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            module.json
            dsa5-vttoms-cave-of-eternal-knowledge.zip
